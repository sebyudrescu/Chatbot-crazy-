name: LitX project quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litx-project-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Code, build and product-flow audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litx
          POSTGRES_PASSWORD: litx_ci_password
          POSTGRES_DB: litx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U litx -d litx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      CI_MOCK_AI: true
      DATABASE_URL: postgresql://litx:litx_ci_password@localhost:5432/litx_ci?schema=public
      OPENAI_API_KEY: sk-ci-placeholder
      APP_ACCESS_PASSWORD: ci-private-password
      APP_AUTH_SALT: ci-static-salt
      CRON_SECRET: ci-retention-secret
      SMOKE_CRON_SECRET: ci-retention-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create ephemeral CI database
        run: |
          npx prisma migrate deploy
          npx prisma db push --skip-generate

      - name: Install PostgreSQL recovery tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Seed relational recovery evidence
        env:
          DR_RECOVERY_SEED: true
        run: node scripts/seed-database-recovery.mjs

      - name: Create isolated recovery target
        run: psql "postgresql://litx:litx_ci_password@localhost:5432/postgres" --set ON_ERROR_STOP=1 --command "CREATE DATABASE litx_restore OWNER litx"

      - name: Database backup and restore drill
        id: recovery
        continue-on-error: true
        env:
          DR_SOURCE_DATABASE_URL: postgresql://litx:litx_ci_password@localhost:5432/litx_ci
          DR_TARGET_DATABASE_URL: postgresql://litx:litx_ci_password@localhost:5432/litx_restore
          DR_CONFIRM_TARGET_DATABASE: litx_restore
        run: |
          npm run test:recovery-safety
          npm run db:restore-drill

      - name: Dependency security audit
        id: dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: TypeScript validation
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: ESLint validation
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Public agent bundle guard
        id: public_agent_bundle
        continue-on-error: true
        run: npm run test:public-agent-bundle

      - name: Start private test server
        id: server
        continue-on-error: true
        run: |
          npm run dev > /tmp/litx-dev.log 2>&1 &
          echo $! > /tmp/litx-dev.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/health > /tmp/litx-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/litx-dev.log
          exit 1

      - name: End-to-end API smoke test
        id: smoke
        continue-on-error: true
        env:
          SMOKE_AI_ASSIST: true
        run: npm run test:smoke

      - name: Knowledge import format tests
        id: knowledge
        continue-on-error: true
        run: npm run test:knowledge-formats

      - name: Website crawler behavior tests
        id: crawler
        continue-on-error: true
        run: |
          npm run test:crawler
          npm run test:crawler-pages

      - name: Commerce contracts, security and isolated database tests
        id: commerce
        continue-on-error: true
        run: |
          npm run test:commerce
          npm run test:commerce-intelligence
          npm run test:product-extractor
          npm run test:commerce-security
          npm run test:shopify-sync
          npm run test:shopify-orders
          npm run test:woocommerce-sync
          npm run test:commerce-db

      - name: Embeddable widget interaction tests
        id: widget
        continue-on-error: true
        run: |
          npm run test:widget
          npm run test:widget-security

      - name: UI content and action safety tests
        id: ui_safety
        continue-on-error: true
        run: |
          npm run test:rich-text
          npm run test:cta
          npm run test:http-security

      - name: Authentication, prompt and memory tests
        id: agent_core
        continue-on-error: true
        run: |
          npm run test:auth
          npm run test:prompt
          npm run test:memory
          npm run test:quality
          npm run test:conversation-guidance
          npm run test:grounding-policy
          npm run test:rag-retrieval
          npm run test:readiness-metrics

      - name: Operational observability safety tests
        id: observability
        continue-on-error: true
        run: npm run test:observability

      - name: Meta and channel security tests
        id: channels
        continue-on-error: true
        run: |
          npm run test:meta
          npm run test:meta-onboarding
          npm run test:meta-connections
          npm run test:meta-attachments
          npm run test:channel-rate-limit
          npm run test:channel-actions
          npm run test:email

      - name: Automation engine safety tests
        id: automations
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://litx:litx_ci_password@localhost:5432/litx_ci?schema=codex_automation_test
        run: |
          npx prisma db push --skip-generate
          npm run test:automations

      - name: Stop private test server
        if: always()
        run: |
          if [ -f /tmp/litx-dev.pid ]; then
            kill "$(cat /tmp/litx-dev.pid)" 2>/dev/null || true
          fi

      - name: Build audit report
        if: always()
        run: |
          mkdir -p audit-report
          {
            echo "# LitX AI project audit"
            echo
            echo "- Run: ${{ github.run_id }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Started by: \`${{ github.event_name }}\`"
            echo "- UTC time: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Dependency audit | ${{ steps.dependencies.outcome }} |"
            echo "| TypeScript | ${{ steps.typecheck.outcome }} |"
            echo "| ESLint | ${{ steps.lint.outcome }} |"
            echo "| Production build | ${{ steps.build.outcome }} |"
            echo "| Public agent bundle guard | ${{ steps.public_agent_bundle.outcome }} |"
            echo "| Test server | ${{ steps.server.outcome }} |"
            echo "| API smoke test | ${{ steps.smoke.outcome }} |"
            echo "| Knowledge formats | ${{ steps.knowledge.outcome }} |"
            echo "| Website crawler | ${{ steps.crawler.outcome }} |"
            echo "| Commerce security and database | ${{ steps.commerce.outcome }} |"
            echo "| Embeddable widget interactions | ${{ steps.widget.outcome }} |"
            echo "| UI content and action safety | ${{ steps.ui_safety.outcome }} |"
            echo "| Authentication, prompt and memory | ${{ steps.agent_core.outcome }} |"
            echo "| Operational observability | ${{ steps.observability.outcome }} |"
            echo "| Database backup/restore drill | ${{ steps.recovery.outcome }} |"
            echo "| Meta and channel security | ${{ steps.channels.outcome }} |"
            echo "| Automation idempotency | ${{ steps.automations.outcome }} |"
            echo
            echo "The audit is read-only: it never edits, commits, pushes or deploys project code."
          } | tee audit-report/report.md >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/litx-dev.log audit-report/dev-server.log 2>/dev/null || true
          cp /tmp/litx-health.json audit-report/health.json 2>/dev/null || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: litx-project-audit-${{ github.run_number }}
          path: audit-report/
          retention-days: 30

      - name: Fail when a core check failed
        if: always()
        run: |
          if [ "${{ steps.dependencies.outcome }}" != "success" ] ||
             [ "${{ steps.typecheck.outcome }}" != "success" ] ||
             [ "${{ steps.lint.outcome }}" != "success" ] ||
             [ "${{ steps.build.outcome }}" != "success" ] ||
             [ "${{ steps.public_agent_bundle.outcome }}" != "success" ] ||
             [ "${{ steps.server.outcome }}" != "success" ] ||
             [ "${{ steps.smoke.outcome }}" != "success" ] ||
             [ "${{ steps.knowledge.outcome }}" != "success" ] ||
             [ "${{ steps.crawler.outcome }}" != "success" ] ||
             [ "${{ steps.commerce.outcome }}" != "success" ] ||
             [ "${{ steps.widget.outcome }}" != "success" ] ||
             [ "${{ steps.ui_safety.outcome }}" != "success" ] ||
             [ "${{ steps.agent_core.outcome }}" != "success" ] ||
             [ "${{ steps.observability.outcome }}" != "success" ] ||
             [ "${{ steps.recovery.outcome }}" != "success" ] ||
             [ "${{ steps.channels.outcome }}" != "success" ] ||
             [ "${{ steps.automations.outcome }}" != "success" ]; then
            exit 1
          fi
